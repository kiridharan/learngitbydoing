<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <style>
      .git-bg { fill: #1a1a1a; }
      .git-icon { fill: #f34f29; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="git-bg" width="180" height="180"/>
  
  <!-- Git logo branches -->
  <g class="git-icon">
    <!-- Center circle -->
    <circle cx="90" cy="90" r="15"/>
    
    <!-- Top-right circle -->
    <circle cx="135" cy="50" r="15"/>
    <line x1="105" y1="75" x2="125" y2="60" stroke="#f34f29" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Bottom-left circle -->
    <circle cx="50" cy="130" r="15"/>
    <line x1="75" y1="105" x2="60" y2="120" stroke="#f34f29" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Bottom-right circle -->
    <circle cx="135" cy="130" r="15"/>
    <line x1="105" y1="105" x2="125" y2="120" stroke="#f34f29" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>